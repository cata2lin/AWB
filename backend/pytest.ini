[pytest]
# Only look in tests/ — the legacy test_*.py scripts at backend/ root are
# ad-hoc connectivity probes (urllib-based), not pytest tests.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Skip slow tests by default — run with `pytest -m slow` to include them,
# or `pytest -m ""` (empty marker expression) to run everything.
addopts = -ra --durations=10 -m "not slow"

markers =
    slow: tests that crunch the whole DB (P&L, full sync). Run with `pytest -m slow`.
